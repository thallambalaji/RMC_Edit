openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BuildRMC Fortune Dashboard API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard summary operations
  - name: customers
    description: Customer management
  - name: purchaseOrders
    description: Purchase order management
  - name: billing
    description: Invoice and billing management
  - name: dc
    description: Delivery challan management
  - name: sales
    description: Sales order management
  - name: qc
    description: Quality control management
  - name: accounts
    description: Accounts and ledger management
  - name: store
    description: Inventory and product management
  - name: transport
    description: Transport and vehicle management
  - name: hrm
    description: Human resource management
  - name: reports
    description: Reports and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
