kind = "web"
previewPath = "/"
title = "BuildRMC Fortune Dashboard"
version = "1.0.0"
id = "artifacts/buildrmc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26166

[services.development]
run = "pnpm --filter @workspace/buildrmc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/buildrmc", "run", "build" ]
publicDir = "artifacts/buildrmc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26166"
BASE_PATH = "/"
